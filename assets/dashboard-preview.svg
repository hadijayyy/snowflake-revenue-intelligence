<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Snowflake Revenue Intelligence dashboard preview</title>
  <desc id="desc">Executive dashboard preview showing a company forecast baseline of 1.588 to 1.593 billion dollars and a revenue versus contracted revenue signal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061a27"/>
      <stop offset=".68" stop-color="#0b2b3b"/>
      <stop offset="1" stop-color="#123c4b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36c0ec"/>
      <stop offset="1" stop-color="#8be1f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#021019" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g opacity=".14" stroke="#b8e9f3" stroke-width="1">
    <path d="M0 116H1280M0 232H1280M0 348H1280M0 464H1280M0 580H1280"/>
    <path d="M100 0V720M260 0V720M420 0V720M580 0V720M740 0V720M900 0V720M1060 0V720M1220 0V720"/>
  </g>
  <path d="M72 90H1208" stroke="#36c0ec" stroke-width="4"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="142" fill="#82d7ee" font-size="18" font-weight="700" letter-spacing="4">RYAN HADI  /  DATA &amp; BI ANALYST</text>
    <text x="72" y="214" fill="#ffffff" font-size="54" font-weight="800" letter-spacing="-2">Snowflake Revenue</text>
    <text x="72" y="274" fill="#ffffff" font-size="54" font-weight="800" letter-spacing="-2">Intelligence</text>
    <text x="72" y="324" fill="#b5cbd1" font-size="22">A public-data case study for revenue planning decisions.</text>

    <g filter="url(#shadow)">
      <rect x="72" y="405" width="492" height="182" rx="10" fill="#0d3040" stroke="#4b92a7"/>
      <text x="102" y="445" fill="#91b6c1" font-size="13" font-weight="700" letter-spacing="2">RECOMMENDED PLANNING BASELINE</text>
      <text x="102" y="506" fill="#ffffff" font-size="46" font-weight="800" letter-spacing="-2">$1.588–1.593B</text>
      <text x="102" y="548" fill="#d2e5e9" font-size="18">Use the company forecast for FY27 Q3.</text>
    </g>

    <g transform="translate(650 395)">
      <text x="0" y="0" fill="#91b6c1" font-size="13" font-weight="700" letter-spacing="2">Q1 FY27 INDEXED SIGNAL  /  100 = BASELINE</text>
      <line x1="0" y1="56" x2="510" y2="56" stroke="#9dbec6" stroke-opacity=".3" stroke-dasharray="5 7"/>
      <line x1="0" y1="18" x2="510" y2="18" stroke="#b8e9f3" stroke-opacity=".16"/>
      <line x1="0" y1="94" x2="510" y2="94" stroke="#b8e9f3" stroke-opacity=".16"/>
      <path d="M18 83 L140 73 L262 62 L384 56 L506 30" fill="none" stroke="url(#cyan)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18 89 L140 72 L262 43 L384 56 L506 60" fill="none" stroke="#d7b66c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#36c0ec" stroke="#0b2735" stroke-width="3"><circle cx="18" cy="83" r="6"/><circle cx="140" cy="73" r="6"/><circle cx="262" cy="62" r="6"/><circle cx="384" cy="56" r="6"/><circle cx="506" cy="30" r="7"/></g>
      <g fill="#d7b66c" stroke="#0b2735" stroke-width="3"><circle cx="18" cy="89" r="6"/><circle cx="140" cy="72" r="6"/><circle cx="262" cy="43" r="6"/><circle cx="384" cy="56" r="6"/><circle cx="506" cy="60" r="7"/></g>
      <text x="0" y="130" fill="#7e9aa3" font-size="13">Q2 FY26</text><text x="126" y="130" fill="#7e9aa3" font-size="13">Q3</text><text x="250" y="130" fill="#7e9aa3" font-size="13">Q4</text><text x="366" y="130" fill="#7e9aa3" font-size="13">Q1 FY27</text><text x="482" y="130" fill="#7e9aa3" font-size="13">Q2</text>
      <text x="0" y="177" fill="#36c0ec" font-size="15" font-weight="700">● Product revenue 111.8</text>
      <text x="260" y="177" fill="#d7b66c" font-size="15" font-weight="700">● Contracted revenue 97.8</text>
    </g>
  </g>
</svg>
